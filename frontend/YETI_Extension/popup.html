<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 280px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1a1a;
      color: #fff;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #333;
    }
    .header h1 {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .header h1 span {
      font-weight: 300;
      color: #666;
    }
    .logo {
      width: 32px;
      height: 32px;
      background: #fff;
      color: #000;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 18px;
    }
    .setting {
      margin-bottom: 12px;
    }
    .setting label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: #999;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .setting select {
      width: 100%;
      padding: 8px 12px;
      background: #2a2a2a;
      border: 1px solid #333;
      border-radius: 6px;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
      outline: none;
    }
    .setting select:focus {
      border-color: #555;
    }
    .setting select option {
      background: #1a1a1a;
    }
    .info {
      font-size: 12px;
      color: #666;
      line-height: 1.6;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #333;
    }
    .info strong {
      color: #999;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #666;
      margin-top: 8px;
    }
    .status .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      display: inline-block;
    }
    .status .dot.online {
      background: #4CAF50;
    }
    .status .dot.offline {
      background: #f44336;
    }
    .btn-open {
      width: 100%;
      padding: 10px;
      background: #2a2a2a;
      border: 1px solid #333;
      border-radius: 6px;
      color: #fff;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 8px;
    }
    .btn-open:hover {
      background: #333;
    }
    .shortcut {
      font-size: 11px;
      color: #555;
      text-align: center;
      margin-top: 8px;
    }
    .shortcut kbd {
      background: #2a2a2a;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">Y</div>
    <h1>YETI<span>dl</span></h1>
  </div>

  <div class="setting">
    <label>Default Quality</label>
    <select id="qualitySelect">
      <option value="144">144p</option>
      <option value="240">240p</option>
      <option value="360">360p</option>
      <option value="480">480p</option>
      <option value="720" selected>720p</option>
      <option value="1080">1080p</option>
      <option value="1440">2K (1440p)</option>
      <option value="2160">4K (2160p)</option>
      <option value="audio">Audio</option>
    </select>
  </div>

  <button class="btn-open" id="openApp">Open YETI App</button>

  <div class="status" id="status">
    <span class="dot" id="statusDot"></span>
    <span id="statusText">Checking...</span>
  </div>

  <div class="info">
    <strong>How to use:</strong><br>
    • Click the <strong>YETI Download</strong> button on any YouTube video<br>
    • Video will be added to your YETI queue<br>
    • Click the extension icon to open YETI app
  </div>

  <div class="shortcut">
    Keyboard shortcut: <kbd>Ctrl+Shift+Y</kbd> (Chrome)
  </div>

  <script src="popup.js"></script>
</body>
</html>
